name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Option A (recommended): Service Account JSON in FIREBASE_SERVICE_ACCOUNT secret
      - name: Deploy to Firebase Hosting (service account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: profit-task
          channelId: live

      # Option B: Legacy token in FIREBASE_TOKEN secret
      - name: Deploy to Firebase Hosting (token)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: |
          npm i -g firebase-tools
          firebase deploy --only hosting --project profit-task --token ${{ secrets.FIREBASE_TOKEN }}

